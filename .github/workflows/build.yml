# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 25
      uses: actions/setup-java@v2
      with:
        java-version: '25'
        distribution: 'adopt'
    - name: Setup locale
      run: |
        sudo locale-gen fr_FR.UTF-8
        sudo update-locale
        export LANG=fr_FR.utf8
        export JAVA_TOOL_OPTIONS="-Duser.language=fr -Duser.region=FR"
        export _JAVA_OPTIONS="-Duser.language=fr -Duser.region=FR"
        export JAVA_ARGS="-Duser.language=fr -Duser.region=FR"
        locale
    - name: Build
      run: gradle build

  # Déploiement : le serveur recompile le worker et le démon avec le master de ce dépôt.
  # Job à part, sur une machine neuve et sans checkout : aucun code du dépôt ne tourne à côté
  # du jeton. Jamais depuis un fork : le secret n'y existe pas.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.repository == 'leek-wars/leekscript'
    runs-on: ubuntu-latest
    # Le jeton est un secret de l'environnement `deploy`, limité à master.
    environment: deploy
    steps:
    - name: Trigger server deploy
      env:
        GH_TOKEN: ${{ secrets.SERVER_DISPATCH_PAT }}
      run: gh api repos/5pilow/leek-wars/dispatches -f event_type=leekscript-updated
